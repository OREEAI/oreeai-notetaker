<!DOCTYPE html>
<html lang="en">
<head>
<title>Zoom Meeting</title>
</head>
<body>
<main>
<div role="toolbar" aria-label="Meeting controls">
<button type="button" role="button" aria-label="Mute my microphone">Microphone</button>
<button type="button" role="button" aria-label="Start my video">Camera</button>
<button type="button" role="button" aria-label="Participants">Participants</button>
<button type="button" role="button" aria-label="Leave">Leave</button>
</div>
<p>You are the only participant in this meeting.</p>
</main>
</body>
</html>
