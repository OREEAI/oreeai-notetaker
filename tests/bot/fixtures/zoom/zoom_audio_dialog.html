<!DOCTYPE html>
<html lang="en">
<head>
<title>Zoom Meeting</title>
</head>
<body>
<main>
<div role="toolbar" aria-label="Meeting controls">
<button type="button" role="button" aria-label="Unmute my microphone">Microphone</button>
<button type="button" role="button" aria-label="Start my video">Camera</button>
<button type="button" role="button" aria-label="Leave">Leave</button>
</div>
<div role="dialog" aria-label="Join audio">
<button type="button" role="button" aria-label="Join with computer audio">Join with computer audio</button>
<button type="button" role="button" aria-label="Join by phone">Join by phone</button>
</div>
</main>
</body>
</html>
