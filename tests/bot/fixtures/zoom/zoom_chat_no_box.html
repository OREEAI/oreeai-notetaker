<!DOCTYPE html>
<html lang="en">
<head>
<title>Zoom Meeting - chat panel without a composer</title>
</head>
<body>
<!-- Host-restricted chat (Z3 scenario 2): the panel opens but no composer
     renders. The announcement must warn and continue. -->
<main>
<footer role="presentation">
<button type="button" role="button" aria-label="mute my microphone">Mute</button>
<button type="button" role="button" aria-label="open the chat panel">Chat</button>
<button type="button" role="button" aria-label="Leave">Leave</button>
</footer>
<aside aria-label="Chat">
<div role="application" aria-label="Chat Message List">Chat is disabled by the host</div>
</aside>
</main>
</body>
</html>
