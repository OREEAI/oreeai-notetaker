<!DOCTYPE html>
<html lang="en">
<head><title>Meet - abc-defg-hij</title></head>
<body>
<main>
<!-- Representative DOM for the mid-call contradiction case: the bot is in a
     live call (leave control + participant chip present) while copy visible
     on the page matches the knocking text query — e.g. a participant-knock
     notification ("... is asking to be let in"), chat, or captions. The
     leave control wins: the bot stays in the call. -->
<div role="toolbar" aria-label="Call controls">
<button type="button" role="button" aria-label="Mute microphone">Microphone</button>
<button type="button" role="button" aria-label="Show everyone">People (3)</button>
<button type="button" role="button" aria-label="Leave call">Leave call</button>
</div>
<ul aria-label="Participants">
<li>Host User</li>
<li>Second Participant</li>
<li>Oree Spike</li>
</ul>
<div role="status">Second Participant is asking to be let in</div>
</main>
</body>
</html>
